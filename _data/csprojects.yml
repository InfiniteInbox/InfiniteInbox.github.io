- title: Ontario Flood History (Research with Toronto Climate Observatory)
  year: 2026
  year_label: 2025–26
  wide: true
  private: true
  tech: [Python, PyTorch, NumPy]
  description: >-
    Ontario's official flood record misses many events. We combine it with precipitation,
    streamflow and newspaper archives, and use positive-unlabeled learning to find
    unrecorded floods and test whether rural and lower-income areas are underreported.
  collaborators:
    - name: Dylan Van Bramer
      github: dylancvb
    - name: Ayusha Thapa
    - name: Hugo Fuhrer
      github: hugofuhrer
  pictures:
    - src: /assets/images/flood/data-availability.png
      alt: Heatmaps of precipitation stations, streamflow stations, newspaper flood reports and disaster database flood events across Ontario, 1800 to 2025
    - src: /assets/images/flood/precip-streamflow.png
      alt: Precipitation and streamflow in Northern Lake Erie for 15 days before and after the flood on 2020-01-12
    - src: /assets/images/flood/watersheds.png
      alt: Ontario's 3 primary and 35 secondary watershed boundaries
    - src: /assets/images/flood/events-by-month.png
      alt: Flood events by month in the CDD, Conservation Ontario, NRCan and OEM records

