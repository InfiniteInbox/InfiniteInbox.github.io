- title: JEPA Project
  year: 2026
  tech: [Python, GDScript]
  description: >-
    Read the seminal papers on energy-based models and JEPA, implemented them in PyTorch,
    and built a Godot 4 visualizer of the learned world model.
  links:
    - label: JEPAimplementation
      url: https://github.com/InfiniteInbox/JEPAimplementation
    - label: i-jepa-sim
      url: https://github.com/InfiniteInbox/i-jepa-sim
  pictures:
    - src: /assets/images/jepa/data-generator.png
      alt: Godot data and scene generator, with sliders for velocity, radius, hold, bounce and friction ranges
    - src: /assets/images/jepa/model-visualizer.png
      alt: Godot model visualizer comparing the ball's real path with the model's imagined path, plus surprise and contraction charts
  details_title: Papers & Texts Read
  details: |
    #### Yann LeCun / JEPA family

    **LeCun, Y.** (2022). *A Path Towards Autonomous Machine Intelligence* (Version 0.9.2) \[Position paper\]. OpenReview. [https://openreview.net/forum?id=BZ5a1r-kVsf](https://openreview.net/forum?id=BZ5a1r-kVsf)

    **LeCun, Y., Chopra, S., Hadsell, R., Ranzato, M., & Huang, F. J.** (2006). A tutorial on energy-based learning. In G. Bakir, T. Hofmann, B. Schölkopf, A. Smola, & B. Taskar (Eds.), *Predicting Structured Data*. MIT Press. [http://yann.lecun.com/exdb/publis/pdf/lecun-06.pdf](http://yann.lecun.com/exdb/publis/pdf/lecun-06.pdf)

    **Assran, M., Duval, Q., Misra, I., Bojanowski, P., Vincent, P., Rabbat, M., LeCun, Y., & Ballas, N.** (2023). Self-supervised learning from images with a joint-embedding predictive architecture (I-JEPA). *CVPR 2023*. arXiv:2301.08243. [https://arxiv.org/abs/2301.08243](https://arxiv.org/abs/2301.08243)

    **Bardes, A., Garrido, Q., Ponce, J., Chen, X., Rabbat, M., LeCun, Y., Assran, M., & Ballas, N.** (2024). Revisiting feature prediction for learning visual representations from video (V-JEPA). *Transactions on Machine Learning Research*. arXiv:2404.08471. [https://arxiv.org/abs/2404.08471](https://arxiv.org/abs/2404.08471)

    **Assran, M., Bardes, A., Fan, D., Garrido, Q., et al. (incl. LeCun, Y.)** (2025). V-JEPA 2: Self-supervised video models enable understanding, prediction and planning. arXiv:2506.09985. [https://arxiv.org/abs/2506.09985](https://arxiv.org/abs/2506.09985)

    **Maes, L., Le Lidec, Q., Scieur, D., LeCun, Y., & Balestriero, R.** (2026). LeWorldModel: Stable end-to-end joint-embedding predictive architecture from pixels. arXiv:2603.19312. [https://arxiv.org/abs/2603.19312](https://arxiv.org/abs/2603.19312)

    **Balestriero, R., & LeCun, Y.** (2025). LeJEPA: Provable and scalable self-supervised learning without the heuristics. arXiv:2511.08544. [https://arxiv.org/abs/2511.08544](https://arxiv.org/abs/2511.08544)

    #### Physics

    **Feynman, R. P., Leighton, R. B., & Sands, M.** (1964). *The Feynman Lectures on Physics, Vol. II*, Chapter 19: The Principle of Least Action. Addison-Wesley. [https://www.feynmanlectures.caltech.edu/II_19.html](https://www.feynmanlectures.caltech.edu/II_19.html)

    #### Mathematics (Optimal Transport)

    **Ambrosio, L.** (2003). Lecture notes on optimal transport problems (§1.1, The Monge–Kantorovich optimal transport problem). In *Mathematical Aspects of Evolving Interfaces*, Lecture Notes in Mathematics, Vol. 1812 (pp. 1–52). Springer. (CIME course, Madeira, 2000.) [http://cvgmt.sns.it/paper/1116/](http://cvgmt.sns.it/paper/1116/)

